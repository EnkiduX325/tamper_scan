name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只安装运行依赖；不安装 requirements-build.txt（PyInstaller 仅在本地打包时需要）。
      # 仓库中不包含 tools/autorunsc64.exe 与 dist/，静态检查也不需要它们。
      - name: Install runtime dependencies and lint/test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      # 只做语法编译，不 import、不运行 main.py / gui.py、不执行真实扫描。
      - name: Syntax check (compile only)
        run: |
          python -m compileall -q core modules main.py gui.py reporter.py tests

      # 单元测试：纯函数 + HKCU 合成注册表 + 降级路径；不依赖管理员权限与外部工具。
      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Static analysis (Ruff)
        run: |
          python -m ruff check .

      - name: Validate sample report JSON
        run: |
          python -c "import json, pathlib; d = json.loads(pathlib.Path('reports/sample_report.json').read_text(encoding='utf-8')); assert d['tool'] == 'TamperScan' and d['version'] == '1.2.0' and d['scan']['modules_total'] == 20 and len(d['scan']['modules']) == 20; print('sample report OK:', len(d['findings']), 'findings,', d['scan']['modules_total'], 'modules')"

      # V1.2：版本号唯一来源与 LICENSE（CC BY-NC 4.0）一致性校验。
      - name: Validate version and license consistency
        run: |
          python -c "import pathlib, sys; sys.path.insert(0, '.'); from core.version import __version__; lic = pathlib.Path('LICENSE').read_text(encoding='utf-8'); assert __version__ == '1.2.0', __version__; assert ('CC BY-NC 4.0' in lic) or ('Attribution-NonCommercial' in lic), 'LICENSE missing CC BY-NC 4.0'; assert 'MIT License' not in lic, 'LICENSE still contains MIT License'; print('version/license OK:', __version__)"
