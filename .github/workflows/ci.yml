name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只安装运行依赖；不安装 requirements-build.txt（PyInstaller 仅在本地打包时需要）。
      # 仓库中不包含 tools/autorunsc64.exe 与 dist/，静态检查也不需要它们。
      - name: Install runtime dependencies and lint/test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      # 只做语法编译，不 import、不运行 main.py / gui_qt.py、不执行真实扫描。
      - name: Syntax check (compile only)
        run: |
          python -m compileall -q core modules main.py gui_qt.py reporter.py tests

      # V1.5：PyQt6 GUI 无头冒烟（offscreen，不弹真实窗口）。
      - name: PyQt6 GUI smoke test (offscreen)
        run: |
          python -c "import os; os.environ['QT_QPA_PLATFORM']='offscreen'; from PyQt6.QtWidgets import QApplication; app = QApplication([]); import gui_qt; window = gui_qt.MainWindow(start_update_check=False); assert len(window.stat_cards) == 5 and window.results_list.count() == 0; print('GUI smoke OK:', gui_qt.MainWindow.__name__)"

      # 单元测试：纯函数 + HKCU 合成注册表 + 降级路径 + PyQt6 offscreen GUI；不依赖管理员权限与外部工具。
      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Static analysis (Ruff)
        run: |
          python -m ruff check .

      - name: Validate sample report JSON
        run: |
          python -c "import json, pathlib; d = json.loads(pathlib.Path('reports/sample_report.json').read_text(encoding='utf-8')); assert d['tool'] == 'TamperScan' and d['version'] == '1.5.0' and d['scan']['modules_total'] == 20 and d['scan']['modules_available'] == 20 and len(d['scan']['modules']) == 20; print('sample report OK:', len(d['findings']), 'findings,', d['scan']['modules_total'], 'modules')"

      # V1.5：版本号唯一来源、AGPL-3.0 LICENSE 与商业双轨文档一致性校验。
      - name: Validate version and license consistency
        run: |
          python -c "import pathlib, sys; sys.path.insert(0, '.'); from core.version import __version__; lic = pathlib.Path('LICENSE').read_text(encoding='utf-8'); assert __version__ == '1.5.0', __version__; assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in lic, 'LICENSE missing AGPL full text'; assert 'Version 3, 19 November 2007' in lic, 'LICENSE missing AGPL version line'; assert ('CC' + ' BY-NC') not in lic, 'LICENSE still mentions the old non-commercial license'; assert pathlib.Path('LICENSE-COMMERCIAL.md').is_file(), 'LICENSE-COMMERCIAL.md missing'; assert pathlib.Path('CLA.md').is_file(), 'CLA.md missing'; print('version/license OK:', __version__, 'AGPL-3.0 + commercial dual-license')"

      # V1.4：基线对比引擎自检（构造两份小报告，断言七种状态与 --fail-on-new 辅助判断）。
      - name: Baseline engine self-check
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from core import baseline as b; f = lambda sev, target, rule, **ev: {'severity': sev, 'target': target, 'rule_id': rule, 'evidence': ev}; base = {'version': '1.5.0', 'findings': [f('HIGH', r'C:\u.exe', 'SIG_UNSIGNED', actual='v1'), f('LOW', r'C:\e.exe', 'RUN_REGISTRY'), f('HIGH', r'C:\r.exe', 'SIG_INVALID'), f('MEDIUM', r'C:\d.exe', 'RUN_REGISTRY'), f('HIGH', r'C:\s.exe', 'SIG_UNSIGNED', actual='same')]}; cur = {'version': '1.5.0', 'findings': [f('HIGH', r'C:\u.exe', 'SIG_UNSIGNED', actual='v2'), f('HIGH', r'C:\e.exe', 'RUN_REGISTRY'), f('MEDIUM', r'C:\n.exe', 'SIG_UNSIGNED'), f('LOW', r'C:\d.exe', 'RUN_REGISTRY'), f('HIGH', r'C:\s.exe', 'SIG_UNSIGNED', actual='same')]}; d = b.diff_reports(base, cur); expect = {'NEW': 1, 'MODIFIED': 1, 'ESCALATED': 1, 'DOWNGRADED': 1, 'BENIGN_UPDATE': 0, 'RESOLVED': 1, 'UNCHANGED': 1}; assert d.counts == expect, d.counts; assert b.has_new_high_medium(d) is True; assert b.has_new_high_medium(b.diff_reports(base, {'findings': [f('LOW', r'C:\n.exe', 'SIG_UNSIGNED')]})) is False; assert callable(getattr(b, 'normalize_target', None)); print('baseline engine OK:', d.counts)"

      # V1.4：攻击链关联引擎自检（真实规则库 + 固定剧本构造 findings，断言 campaign 结构）。
      - name: Correlator self-check
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from core import correlator as c; rules = c.load_chain_rules(); templates = rules.get('chain_templates') or []; assert templates, 'attack_chain.json has no chain_templates'; assert 'anti_patterns' in rules and isinstance(rules['anti_patterns'], list), 'anti_patterns missing'; assert 'tactic_mapping' in rules, 'tactic_mapping missing'; camps = [camp for t in templates for camp in (c.correlate([{'severity': 'HIGH', 'rule_id': str(step['rule_ids'][0]), 'target': r'C:\Shared\Sample.dll', 'evidence': {}} for step in t['steps']], rules=rules).get('campaigns') or [])]; assert camps, 'no campaign produced for any fixed template'; assert any(camp.get('steps') for camp in camps); assert all(camp.get('confidence') in ('high', 'medium', 'low') for camp in camps); empty = c.correlate([], rules=rules); assert 'campaigns' in empty and 'stats' in empty and 'suppressed' in empty; print('correlator OK:', [camp.get('chain_id') for camp in camps][:3], [camp.get('confidence') for camp in camps][:3])"
