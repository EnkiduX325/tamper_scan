name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只安装运行依赖；不安装 requirements-build.txt（PyInstaller 仅在本地打包时需要）。
      # 仓库中不包含 tools/autorunsc64.exe 与 dist/，静态检查也不需要它们。
      - name: Install runtime dependencies and Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      # 只做语法编译，不 import、不运行 main.py / gui.py、不执行真实扫描。
      - name: Syntax check (compile only)
        run: |
          python -m compileall -q core modules main.py gui.py reporter.py

      - name: Static analysis (Ruff)
        run: |
          python -m ruff check .

      - name: Validate sample report JSON
        run: |
          python -c "import json, pathlib; d = json.loads(pathlib.Path('reports/sample_report.json').read_text(encoding='utf-8')); assert d['tool'] == 'TamperScan' and d['version'] == '1.0.0'; print('sample report OK:', len(d['findings']), 'findings')"
