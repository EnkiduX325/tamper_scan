# 仅用于工具配置（非 Python 打包元数据）
# 本项目是 Windows 本地扫描工具，运行方式见 README，不通过 pip 安装。

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff.lint]
# 先只启用"语法/未定义名称/导入"级别的规则，避免历史代码风格问题阻塞 CI；
# 后续可逐步扩展为 E/W/F/I。
select = ["E9", "F63", "F7", "F82"]
